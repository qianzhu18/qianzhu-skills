interface:
  display_name: "Qianzhu Writing Style"
  short_description: "让千逐的内容更像本人，尤其擅长把 AI 编程、工具实践和日常现象写出有判断的洞察"
  default_prompt: "Use $qianzhu-writing-style to draft or revise a qianzhu article or bio with practical value, personal judgment, visible growth trace, and stronger everyday-phenomenon insight. If the topic is AI coding entry, student advice, IDE onboarding, or 'what to learn after Doubao/DeepSeek/Qwen', frame it as a practical ability leverage rather than a cold tool tutorial, and structure it clearly around what it is, why it matters, and how to start. If the topic comes from internet culture or a small daily trigger, keep digging until it lands on a specific reminder rather than a weak social closing. If this is an Obsidian article-production task, continue into the full chain: title assets, short promo copy, explicit $wechat-cover WeChat cover completion, and $smart-illustrator inline image completion."
